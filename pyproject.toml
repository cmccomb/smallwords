[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smallwords"
version = "0.1.0"
description = "Controlled-vocabulary prompts plus portable GBNF and JSON Schema resources for small-word English generation."
readme = "README.md"
license = "MIT"
authors = [{name = "Christopher McComb"}]
requires-python = ">=3.10"
dependencies = []
keywords = ["grammar", "gbnf", "json-schema", "structured-output", "controlled-language", "simple-english"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
smallwords = ["data/*.txt"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
